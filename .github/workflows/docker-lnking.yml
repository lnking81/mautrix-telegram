# Fork-only workflow: builds the patched bridge image for the homelab Matrix
# stack (nu.de) and publishes it to GHCR. Kept in its own file so rebases onto
# new upstream releases do not conflict with upstream workflows.
name: docker-lnking

on:
  push:
    branches:
      - lnking
    tags:
      - "v*-lnking.*"
  workflow_dispatch:

concurrency:
  group: docker-lnking-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mautrix-telegram

jobs:
  image:
    name: Build and push image (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          # maubuild stamps the version from git history and tags
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mautrix-telegram
          cache-to: type=gha,mode=max,scope=mautrix-telegram
